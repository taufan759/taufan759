name: Stats Cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metrics

      - uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: grs

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cards
        working-directory: grs
        env:
          PAT_1: ${{ secrets.METRICS_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          cat > gen.mjs <<'EOF'
          import fs from "fs";
          import statsHandler from "./api/index.js";
          import langsHandler from "./api/top-langs.js";

          const run = (handler, query) =>
            new Promise((resolve, reject) => {
              const headers = {};
              const res = {
                setHeader: (k, v) => (headers[k] = v),
                send: (body) => resolve(body),
              };
              Promise.resolve(handler({ query }, res)).catch(reject);
            });

          const common = { username: "taufan759", theme: "algolia", hide_border: "true" };
          fs.writeFileSync("../github-stats.svg", await run(statsHandler, {
            ...common, show_icons: "true", include_all_commits: "true", count_private: "true",
          }));
          fs.writeFileSync("../github-languages.svg", await run(langsHandler, {
            ...common, layout: "compact", langs_count: "8",
          }));
          EOF
          node gen.mjs

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add github-stats.svg github-languages.svg
          git commit -m "Update stats cards" || echo "No changes"
          git push origin metrics
